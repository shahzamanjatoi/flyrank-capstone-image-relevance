services:
  api:
    build: .
    container_name: imagerelevance-api
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
      - ./tests:/app/tests

  db:
    image: postgres:16
    container_name: imagerelevance-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: imagerelevance
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d imagerelevance"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: